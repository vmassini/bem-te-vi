<title>Jogo do Bem-te-vi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: a praça em 3D ocupa a tela inteira como fundo; a interface flutua por cima,
   sempre dentro da margem lateral e das áreas seguras do celular. Visual único (não muda com o tema). */
:root {
  --bg: #173a26;
  --ink: #2b2118;
  --ink-soft: #6b5a48;
  --label: #9a5b1e;
  --paper: #fffdf3;
  --paper-a: rgba(255, 253, 243, 0.95);
  --fact: #fff1b8;
  --yellow: #ffd21f;
  --orange: #ff8c42;
  --green: #3fae6a;
  --pink: #ff5a7a;
  --red: #d8402a;
  --font-display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  --gut-l: max(16px, env(safe-area-inset-left, 0px));
  --gut-r: max(16px, env(safe-area-inset-right, 0px));
  --top: calc(env(safe-area-inset-top, 0px) + 10px);
  --bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  color-scheme: dark;
}
[hidden] { display: none !important; }
html { height: 100%; box-sizing: border-box; overflow: hidden; background: var(--bg); }
body {
  height: 100%; margin: 0; overflow: hidden; box-sizing: border-box;
  background: var(--bg); color: var(--ink); font-family: var(--font-body);
  padding-left: var(--gut-l); padding-right: var(--gut-r);
  touch-action: none; user-select: none; -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
}
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
.ui { position: fixed; left: var(--gut-l); right: var(--gut-r); pointer-events: none; }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }

#hud {
  top: var(--top); right: calc(var(--gut-r) + 54px); max-width: 440px;
  background: var(--paper-a); border-radius: 16px; padding: 9px 14px 10px;
  box-shadow: 0 3px 12px rgba(0, 0, 0, 0.18);
}
.hud-top { display: flex; justify-content: space-between; gap: 8px; font: 800 11px/1.2 var(--font-body); letter-spacing: 0.06em; color: var(--label); }
.hud-top .right { color: var(--ink); letter-spacing: 0; font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.hud-body { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 12px; margin-top: 6px; font: 800 12px/1 var(--font-body); }
.meter { display: flex; align-items: center; gap: 6px; }
.bar { width: 78px; height: 10px; border-radius: 5px; background: rgba(43, 33, 24, 0.13); overflow: hidden; }
.bar.sm { width: 26px; height: 7px; }
.bar > i { display: block; height: 100%; width: 0; border-radius: 5px; background: var(--c, var(--green)); }
.hearts { display: flex; gap: 3px; margin-left: auto; }
.hearts svg { width: 17px; height: 17px; }
.chick { display: inline-flex; align-items: center; gap: 4px; }
.chick b { width: 13px; height: 13px; border-radius: 50%; background: #e9b3a0; border: 1.5px solid var(--ink); }
.chick.lost b { background: rgba(43, 33, 24, 0.2); border-color: var(--ink-soft); }
.chick.lost .bar { opacity: 0.3; }
.tabnum { font-variant-numeric: tabular-nums; }

#mute {
  position: fixed; top: var(--top); right: var(--gut-r); width: 44px; height: 44px; border-radius: 50%;
  border: 0; background: var(--paper-a); display: grid; place-items: center; cursor: pointer;
  box-shadow: 0 3px 12px rgba(0, 0, 0, 0.18); pointer-events: auto;
}
#mute svg { width: 24px; height: 24px; }

#toasts { top: calc(var(--top) + 76px); display: flex; flex-direction: column; align-items: center; gap: 6px; }
.toast {
  max-width: 360px; background: var(--paper-a); border: 2.5px solid var(--c, var(--ink)); border-radius: 13px;
  padding: 7px 14px; font: 800 14px/1.3 var(--font-body); text-align: center; text-wrap: balance;
  animation: toast-in 0.18s ease-out;
}
@keyframes toast-in { from { opacity: 0; transform: translateY(-6px); } }

#hint { bottom: var(--bottom); display: flex; flex-direction: column; align-items: center; gap: 8px; }
#hint .msg { background: rgba(255, 253, 243, 0.92); border-radius: 14px; padding: 6px 14px; font: 800 13px/1.3 var(--font-body); text-align: center; }
#hint .act {
  pointer-events: auto; border: 0; border-radius: 22px; height: 44px; padding: 0 22px; cursor: pointer;
  background: var(--ink); color: var(--paper); font: 800 17px var(--font-display); box-shadow: 0 3px 0 rgba(0, 0, 0, 0.3);
}
#hint .acts { display: flex; gap: 10px; justify-content: center; }
#hint .act.alt { background: var(--paper-a); color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink), 0 3px 0 rgba(0, 0, 0, 0.3); }

#duet { bottom: var(--bottom); display: flex; flex-direction: column; align-items: center; gap: 12px; }
#duet .dots { display: flex; gap: 8px; min-height: 18px; }
#duet .dots i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--ink); background: rgba(255, 253, 243, 0.8); }
#duet .msg { margin: 0; font: 800 16px/1.3 var(--font-body); background: rgba(255, 253, 243, 0.92); padding: 6px 14px; border-radius: 14px; text-align: center; }
.crest { position: relative; width: min(260px, 100%); height: 20px; border-radius: 10px; background: var(--paper-a); border: 2px solid var(--ink); overflow: visible; }
.crest .zone { position: absolute; left: 36%; width: 28%; top: 0; bottom: 0; background: var(--yellow); }
.crest .mark { position: absolute; top: -9px; bottom: -3px; width: 4px; margin-left: -2px; background: var(--ink); border-radius: 2px; }
.notes { display: flex; gap: 14px; justify-content: center; }
.notes button {
  pointer-events: auto; width: 86px; height: 86px; border-radius: 50%; border: 3px solid var(--ink); cursor: pointer;
  font: 800 25px var(--font-display); color: var(--ink); background: var(--c); box-shadow: 0 4px 0 rgba(43, 33, 24, 0.4);
  transition: transform 0.08s, opacity 0.15s, box-shadow 0.15s;
}
.notes button:disabled { opacity: 0.55; cursor: default; }
.notes button.lit { opacity: 1; box-shadow: 0 0 0 8px rgba(255, 253, 243, 0.85), 0 4px 0 rgba(43, 33, 24, 0.4); }
.notes button:active:not(:disabled) { transform: scale(0.93); }

#card {
  position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; overflow-y: auto;
  padding: calc(var(--top) + 8px) var(--gut-r) calc(var(--bottom) + 8px) var(--gut-l);
}
#card.low { align-items: flex-end; }
.panel {
  width: 100%; max-width: 420px; margin: auto 0; background: var(--paper); border-radius: 22px; padding: 20px;
  box-shadow: 0 12px 34px rgba(0, 0, 0, 0.28); display: flex; flex-direction: column; gap: 10px; box-sizing: border-box;
}
.eyebrow { margin: 0; font: 800 12px/1.2 var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--label); }
.panel h2 { margin: 0; font: 800 30px/1.08 var(--font-display); text-wrap: balance; }
.panel .body { margin: 0; font: 600 15px/1.45 var(--font-body); }
.panel .art { display: flex; justify-content: center; gap: 10px; padding: 4px 0; }
.panel .art svg { width: 30px; height: 38px; }
.fact { background: var(--fact); border-radius: 14px; padding: 11px 14px 12px; }
.fact span { font: 800 11px var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--label); }
.fact p { margin: 4px 0 0; font: 600 14px/1.4 var(--font-body); }
.rows { margin: 0; display: grid; grid-template-columns: 1fr auto; font: 600 14px/1.3 var(--font-body); }
.rows dt, .rows dd { margin: 0; padding: 7px 0; border-bottom: 1px solid rgba(43, 33, 24, 0.1); }
.rows dt { color: var(--ink-soft); }
.rows dd { font-weight: 800; text-align: right; font-variant-numeric: tabular-nums; }
.stars { display: flex; justify-content: center; gap: 10px; }
.stars svg { width: 40px; height: 40px; }
.go {
  align-self: center; margin-top: 4px; min-width: 190px; height: 48px; border-radius: 24px; border: 0; cursor: pointer;
  background: var(--ink); color: var(--paper); font: 800 19px var(--font-display); pointer-events: auto;
}

#title {
  position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: space-between;
  padding: calc(var(--top) + 46px) var(--gut-r) calc(var(--bottom) + 26px) var(--gut-l); text-align: center; pointer-events: none;
}
#title h1 {
  margin: 0; font: 800 min(92px, calc((100vw - var(--gut-l) - var(--gut-r)) / 5.4))/0.95 var(--font-display); color: var(--yellow); white-space: nowrap;
  -webkit-text-stroke: 2.5px var(--ink); text-shadow: 0 5px 0 var(--ink);
}
#title .tag { margin: 10px 0 0; font: 800 14px var(--font-body); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink); background: var(--paper-a); display: inline-block; padding: 4px 12px; border-radius: 10px; }
#title .foot { display: flex; flex-direction: column; align-items: center; gap: 10px; }
#title .go { min-width: 180px; height: 54px; font-size: 23px; }
#title small { font: 800 13px var(--font-body); color: var(--paper); text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6); }

#marks { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
#marks .arrow {
  position: absolute; left: 0; top: 0; width: 0; height: 0; margin: -12px 0 0 -10px;
  border-left: 20px solid var(--c); border-top: 12px solid transparent; border-bottom: 12px solid transparent;
  filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.45));
}
#marks .tag {
  position: absolute; left: 0; top: 0; background: var(--c, var(--paper-a)); color: var(--ink);
  font: 800 13px/1 var(--font-body); padding: 5px 10px; border-radius: 12px; white-space: nowrap;
  border: 2px solid var(--ink);
}
@media (prefers-reduced-motion: reduce) { .toast { animation: none; } .notes button { transition: none; } }
</style>
<canvas id="gl" tabindex="0" aria-label="Praça em 3D. Toque para voar até um ponto. Arraste para girar a câmera."></canvas>
<div id="marks" aria-hidden="true"></div>
<header id="hud" class="ui" hidden>
  <div class="hud-top"><span class="lbl"></span><span class="right"></span></div>
  <div class="hud-body"></div>
</header>
<button id="mute" type="button" aria-label="Desligar o som"></button>
<div id="toasts" class="ui" aria-live="polite"></div>
<div id="hint" class="ui" hidden><span class="msg"></span><div class="acts"><button class="act" type="button" hidden></button><button class="act" type="button" hidden></button></div></div>
<section id="duet" class="ui" hidden>
  <div class="dots"></div>
  <p class="msg"></p>
  <div class="crest" hidden><div class="zone"></div><div class="mark"></div></div>
  <div class="notes">
    <button type="button" data-n="0" style="--c: #ff8c42">BEM</button>
    <button type="button" data-n="1" style="--c: #ffd21f">TE</button>
    <button type="button" data-n="2" style="--c: #4fbf7a">VI</button>
  </div>
</section>
<section id="title" hidden>
  <div><h1>Bem-te-vi</h1><p class="tag">Um ciclo de vida na praça</p></div>
  <div class="foot"><button class="go" type="button">Jogar</button><small>Parceiro · Ninho · Filhotes</small></div>
</section>
<div id="card" hidden>
  <div class="panel" role="dialog" aria-live="polite">
    <p class="eyebrow"></p>
    <h2></h2>
    <div class="stars" hidden></div>
    <div class="art" hidden></div>
    <p class="body"></p>
    <dl class="rows" hidden></dl>
    <div class="fact"><span>Você sabia?</span><p></p></div>
    <button class="go" type="button"></button>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script src="modelos.js"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const UI = {
  hud: $('#hud'), hudLbl: $('#hud .lbl'), hudRight: $('#hud .right'), hudBody: $('#hud .hud-body'),
  toasts: $('#toasts'), hint: $('#hint'), hintMsg: $('#hint .msg'), hintActs: [...document.querySelectorAll('#hint .act')],
  duet: $('#duet'), dots: $('#duet .dots'), duetMsg: $('#duet .msg'), crest: $('#duet .crest'), crestMark: $('#duet .crest .mark'),
  notes: [...document.querySelectorAll('#duet .notes button')],
  title: $('#title'), titleGo: $('#title .go'), card: $('#card'), marks: $('#marks'), mute: $('#mute')
};
const CARD = {
  eyebrow: $('#card .eyebrow'), h2: $('#card h2'), stars: $('#card .stars'), art: $('#card .art'),
  body: $('#card .body'), rows: $('#card .rows'), fact: $('#card .fact'), factP: $('#card .fact p'), go: $('#card .go')
};
function fatal(msg) {
  UI.card.hidden = false; CARD.eyebrow.textContent = 'Ops'; CARD.h2.textContent = 'Não deu para abrir o 3D';
  CARD.body.textContent = msg; CARD.fact.hidden = true; CARD.go.hidden = true;
}
if (typeof THREE === 'undefined') { fatal('O motor 3D não carregou. Verifique a conexão com a internet e abra de novo.'); return; }
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas: $('#gl'), antialias: true }); }
catch (e) { fatal('Este aparelho ou navegador não tem suporte a gráficos 3D (WebGL).'); return; }

// ---------- utilidades ----------
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (k, dt) => 1 - Math.exp(-k * dt);
const wrapA = a => { a = (a + Math.PI) % (2 * Math.PI); if (a < 0) a += 2 * Math.PI; return a - Math.PI; };
const lerpAngle = (a, b, t) => a + wrapA(b - a) * t;
const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const tmpA = V(), tmpB = V();
let clock = 0, stage = null;

// ---------- som (sintetizado) ----------
let AC = null, muted = false;
try { muted = localStorage.getItem('btv-mudo') === '1'; } catch (e) {}
function ensureAudio() { try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (e) {} }
const ICON_ON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#2b2118"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="#2b2118" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
const ICON_OFF = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#2b2118"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" stroke="#d8402a" stroke-width="2.2" stroke-linecap="round"/></svg>';
function paintMute() { UI.mute.innerHTML = muted ? ICON_OFF : ICON_ON; UI.mute.setAttribute('aria-label', muted ? 'Ligar o som' : 'Desligar o som'); }
function toggleMute() { muted = !muted; try { localStorage.setItem('btv-mudo', muted ? '1' : '0'); } catch (e) {} paintMute(); }
UI.mute.addEventListener('click', () => { ensureAudio(); toggleMute(); });
paintMute();
// O título cabe numa linha só em qualquer tela. No celular a fonte chega depois e sai mais larga que no navegador,
// então o tamanho é refeito quando a tela muda (recomeca) e encolhido sempre que o texto ficar mais largo que o espaço.
function ajustarTitulo(recomeca = true) {
  const h = UI.title.querySelector('h1'), cs = getComputedStyle(UI.title);
  if (!UI.title.clientWidth) return;
  if (recomeca) h.style.fontSize = '';
  const livre = UI.title.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight), larg = h.scrollWidth;
  if (larg > livre + 0.5) h.style.fontSize = (parseFloat(getComputedStyle(h).fontSize) * livre / larg * 0.97) + 'px';
}
window.addEventListener('resize', () => ajustarTitulo());
if (document.fonts) document.fonts.ready.then(() => ajustarTitulo());
if (window.ResizeObserver) new ResizeObserver(() => ajustarTitulo(false)).observe(UI.title.querySelector('h1'));
let toneGain = 1; // volume extra para sons distantes (canto das outras aves)
function tone(f1, f2, dur, type = 'sine', vol = 0.15, delay = 0) {
  if (!AC || muted || toneGain < 0.02) return;
  vol *= toneGain;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(30, f2), t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + 0.03);
}
const NOTES = [
  { name: 'BEM', color: '#ff8c42', play: d => { tone(1500, 1950, 0.15, 'sine', 0.2, d); tone(750, 975, 0.15, 'triangle', 0.05, d); } },
  { name: 'TE', color: '#ffd21f', play: d => { tone(2350, 2500, 0.11, 'sine', 0.2, d); tone(1175, 1250, 0.11, 'triangle', 0.05, d); } },
  { name: 'VI', color: '#4fbf7a', play: d => { tone(3100, 1750, 0.4, 'sine', 0.2, d); tone(1550, 875, 0.4, 'triangle', 0.05, d); } }
];
const SFX = {
  pick: () => tone(900, 1500, 0.09, 'triangle', 0.12),
  drop: () => { tone(650, 1000, 0.1, 'triangle', 0.12); tone(1000, 1500, 0.12, 'triangle', 0.1, 0.09); },
  hit: () => { tone(320, 110, 0.16, 'square', 0.08); tone(1800, 900, 0.08, 'sine', 0.08); },
  wrong: () => tone(240, 170, 0.28, 'square', 0.07),
  alarm: () => { tone(1250, 900, 0.14, 'sawtooth', 0.045); tone(1250, 900, 0.14, 'sawtooth', 0.045, 0.2); },
  splash: () => tone(500, 120, 0.2, 'triangle', 0.05),
  win: () => [0, 4, 7, 12].forEach((s, i) => { const f = 523 * Math.pow(2, s / 12); tone(f, f * 1.01, 0.24, 'triangle', 0.12, i * 0.11); }),
  sad: () => [0, -3, -7].forEach((s, i) => { const f = 440 * Math.pow(2, s / 12); tone(f, f * 0.98, 0.3, 'triangle', 0.1, i * 0.18); }),
  song: (d = 0) => { NOTES[0].play(d); NOTES[1].play(d + 0.2); NOTES[2].play(d + 0.36); },
  chick: () => tone(3400, 3900, 0.06, 'sine', 0.035)
};
const songBeak = t => (t >= 0 && t < 0.15) || (t >= 0.2 && t < 0.31) || (t >= 0.36 && t < 0.76) ? 1 : 0;

// ---------- interface ----------
const TONES = { ink: '#2b2118', red: '#d8402a', green: '#3fae6a', orange: '#ff8c42', yellow: '#ffd21f' };
const toastSeen = {};
function toast(msg, tone = 'ink', dur = 2.6, key) {
  const now = performance.now();
  if (key) { if (toastSeen[key] && now - toastSeen[key] < 4000) return; toastSeen[key] = now; }
  const el = document.createElement('div');
  el.className = 'toast'; el.style.setProperty('--c', TONES[tone] || tone); el.textContent = msg;
  UI.toasts.appendChild(el);
  while (UI.toasts.children.length > 2) UI.toasts.firstChild.remove();
  setTimeout(() => el.remove(), dur * 1000);
}
function setText(el, s) { if (el._t !== s) { el._t = s; el.textContent = s; } }
function setW(el, v) { const s = (Math.round(clamp(v, 0, 1) * 1000) / 10) + '%'; if (el && el._w !== s) { el._w = s; el.style.width = s; } }
function showOnly(...names) {
  UI.hud.hidden = !names.includes('hud'); UI.duet.hidden = !names.includes('duet'); UI.card.hidden = !names.includes('card');
  UI.title.hidden = !names.includes('title'); UI.hint.hidden = !names.includes('hint');
}
function setHud(label, body) { UI.hud.hidden = false; setText(UI.hudLbl, label); UI.hudBody.innerHTML = body; setText(UI.hudRight, ''); }
// Rodapé: uma mensagem e até dois botões de ação ({ label, fn, alt }).
function setHint(msg, acts = []) {
  setText(UI.hintMsg, msg || ''); UI.hintMsg.hidden = !msg;
  UI.hintActs.forEach((b, i) => {
    const a = acts[i]; b.hidden = !a; b._fn = a ? a.fn : null;
    if (a) { setText(b, a.label); b.classList.toggle('alt', !!a.alt); }
  });
}
UI.hintActs.forEach(b => b.addEventListener('click', () => { ensureAudio(); if (b._fn) b._fn(); }));

      }

}

// ---------- ETAPA 1: dueto ----------
function duetoStage(sp) {
  sp = sp || pontosCasal()[0];
  const st = { phase: 'intro', t: 0, seq: [], idx: 0, aff: 0, lives: 3, li: 0, crestPos: 0, crestDir: 1, crestT: 0, pause: 0, pressed: -1, pressT: 0, hl: -1, hlT: 0, bubbles: [], wonT: 0, failT: 0, sang: 0, heartT: 0 };
  const pSeat = sp.his, mSeat = sp.her, mid = pSeat.clone().lerp(mSeat, 0.5), n = sp.n;
  const far = mSeat.clone().addScaledVector(n, -16).add(V(0, 9, 0));
  let dotsSig = '';
  function sing(i, who) {
    NOTES[i].play(0);
    const F = who === 'm' ? M : P; F.beak = 1;
    if (who === 'm') { st.hl = i; st.hlT = 0.32; }
    st.bubbles.push({ F, text: NOTES[i].name + '!', color: NOTES[i].color, t: 0 });
  }
  function newRound() {
    if (st.seq.length === 0) for (let i = 0; i < 3; i++) st.seq.push(randi(0, 2));
    else if (st.seq.length < 7) st.seq.push(randi(0, 2));

  }
  function afterRound() {
    if (st.aff >= 100) { st.phase = 'won'; st.wonT = 0; SFX.win(); toast('Vocês formaram um casal!', 'green', 2.8); }
    else { st.phase = 'pause'; st.pause = 1.0; }
  }
  function press(i) {
    if (st.phase !== 'play' || !(i >= 0 && i <= 2)) return;
    sing(i, 'p'); st.pressed = i; st.pressT = 0.18;
    if (i === st.seq[st.idx]) {
      st.idx++;
      if (st.idx >= st.seq.length) { st.aff = Math.min(100, st.aff + 18); st.phase = 'crest'; st.crestPos = 0; st.crestDir = 1; st.crestT = 0; }
    } else {
      st.lives--; SFX.wrong();
      if (st.lives <= 0) { st.phase = 'fail'; st.failT = 0; SFX.sad(); toast('Ela não gostou do dueto e voou para longe…', 'red', 2.8); flyTo(M, far); }
      else { toast(`Nota errada! Ouça de novo. Restam ${st.lives} ${st.lives === 1 ? 'vida' : 'vidas'}.`, 'red', 2.4); st.phase = 'listen'; st.t = -1.1; st.li = 0; st.idx = 0; }
    }
  }
  function crest() {
    if (st.phase !== 'crest') return;
    if (st.crestPos > 0.36 && st.crestPos < 0.64) { st.aff = Math.min(100, st.aff + 12); P.crest = 1.8; SFX.pick(); toast('Crista perfeita! Ela gostou.', 'yellow', 1.8); }
    else { P.crest = 0.9; toast('Quase! Erga quando o marcador estiver no dourado.', 'orange', 2); }
    afterRound();
  }
  UI.notes.forEach(b => { b.onclick = () => { ensureAudio(); press(+b.dataset.n); }; });
  const onCrestTap = () => crest();
  return {
    st,
    enter() {
      showOnly('hud', 'duet');
      setHud('ETAPA 1 · O DUETO', `<div class="meter">Afinidade <div class="bar"><i id="h-aff" style="--c: var(--pink)"></i></div></div><div class="hearts" id="h-lives"></div>`);
      place(P, pSeat, yawTo(pSeat, mSeat)); marker.visible = false; P.look = 0; M.look = 0;
      M.m.root.visible = true;
      st.chegando = M.pos.distanceTo(mSeat) > 0.3;
      if (st.chegando) { place(M, far); flyTo(M, mSeat, true); } else place(M, mSeat, yawTo(mSeat, pSeat));
      cam.mode = 'fixed'; cam.fixedPos.copy(mid).addScaledVector(n, 2.9).add(V(0, 0.45, 0)); cam.fixedLook.copy(mid).add(V(0, -0.38, 0));
      if (camera.position.distanceTo(cam.fixedPos) > 12) { camLook.copy(cam.fixedLook); camera.position.copy(cam.fixedPos); }
      UI.crest.addEventListener('pointerdown', onCrestTap);
    },
    exit() { UI.notes.forEach(b => { b.onclick = null; }); UI.crest.removeEventListener('pointerdown', onCrestTap); P.look = M.look = null; },
    update(dt) {
      st.t += dt; st.pressT -= dt; st.hlT -= dt;
      if (M.perched) M.faceYaw = yawTo(M.pos, P.pos);
      switch (st.phase) {
        case 'intro': if (M.perched && st.t > 1.0) newRound(); break;
        case 'listen': {
          const gap = Math.max(0.42, 0.62 - st.seq.length * 0.02);
          if (st.li < st.seq.length && st.t >= st.li * gap) { sing(st.seq[st.li], 'm'); M.crest = 0.8; st.li++; }
          if (st.li >= st.seq.length && st.t >= st.seq.length * gap + 0.15) st.phase = 'play';

          if (st.crestPos > 1) { st.crestPos = 1; st.crestDir = -1; }
          if (st.crestPos < 0) { st.crestPos = 0; st.crestDir = 1; }
          if (st.crestT > 3.6) { toast('A crista ficou abaixada.', 'orange', 1.8); afterRound(); }
          break;
        case 'pause': st.pause -= dt; if (st.pause <= 0) newRound(); break;
        case 'won':
          st.wonT += dt; P.crest = M.crest = 1.2;
          if (st.sang === 0 && st.wonT > 0.5) { st.sang = 1; SFX.song(); M.beak = 1; }
          if (st.sang === 1 && st.wonT > 1.4) { st.sang = 2; SFX.song(); P.beak = 1; }
          if (st.wonT > 3.2) { G.lives = st.lives; G.eggs = clamp(1 + st.lives, 2, 4); go(card2()); }
          break;
        case 'fail':

            place(M, far); flyTo(M, mSeat, true);
            st.chegando = true; toast('Outra bem-te-vi está chegando. Tente de novo!', 'green', 2.6);
          }
          break;

      updateFlyer(P, dt); updateFlyer(M, dt);
      if (st.phase === 'won') { P.beak = Math.max(P.beak, songBeak(st.wonT - 1.4)); M.beak = Math.max(M.beak, songBeak(st.wonT - 0.5)); }
      for (const b of st.bubbles) b.t += dt;
      st.bubbles = st.bubbles.filter(b => b.t < 0.9);
    },
    ui() {
      for (const b of st.bubbles) markTag(b.F.m.head.getWorldPosition(V()), b.text, b.color, 22 + b.t * 40);
      setW(document.getElementById('h-aff'), st.aff / 100);
      const lv = document.getElementById('h-lives'); const ls = 'L' + st.lives;
      if (lv && lv._s !== ls) { lv._s = ls; lv.innerHTML = [0, 1, 2].map(i => HEART(i < st.lives ? '#d8402a' : 'rgba(43,33,24,0.15)')).join(''); }
      const sig = st.seq.map((s, i) => {
        const filled = (st.phase === 'listen' && i < st.li) || (st.phase === 'play' && i < st.idx) || ['crest', 'pause', 'won'].includes(st.phase);
        return filled ? s : 'x';
      }).join(',');
      if (sig !== dotsSig) { dotsSig = sig; UI.dots.innerHTML = sig ? sig.split(',').map(v => `<i style="background:${v === 'x' ? '' : NOTES[+v].color}"></i>`).join('') : ''; }
      const msgs = { intro: st.chegando ? 'Uma bem-te-vi está chegando…' : 'Ela vai cantar. Preste atenção…', listen: 'Ouça o canto dela', play: `Sua vez! Repita as ${st.seq.length} notas`, crest: 'Erga a crista! Toque quando o marcador passar no dourado', pause: 'Boa! Ela vai cantar de novo…', won: 'Vocês formaram um casal!', fail: 'Ela voou para longe…' };
      setText(UI.duetMsg, msgs[st.phase]);
      UI.crest.hidden = st.phase !== 'crest'; UI.crest.style.pointerEvents = 'auto';
      UI.crestMark.style.left = (st.crestPos * 100) + '%';
      UI.notes.forEach((b, i) => { b.disabled = st.phase !== 'play'; b.classList.toggle('lit', (st.hlT > 0 && st.hl === i) || (st.pressT > 0 && st.pressed === i)); });
    },
    onTap() { crest(); },
    onKey(k) { if (k === 'ok') crest(); else press(+k - 1); }
  };
}

// ---------- ETAPA 2: ninho ----------
const RIGID = ['graveto', 'capim', 'barbante', 'plastico'], TRASH = ['barbante', 'plastico'], SOFT = ['pena', 'musgo'];
const ITEM_COR = { graveto: 0xffd21f, capim: 0xffd21f, pena: 0x7fd8ff, musgo: 0x7fd8ff, barbante: 0xff5a3d, plastico: 0xff5a3d };
const ITEM_TAG = { graveto: '#ffe27a', capim: '#ffe27a', pena: '#bfeeff', musgo: '#bfeeff', barbante: '#ffb39a', plastico: '#ffb39a' };
const ITEM_ROTULO = { graveto: 'graveto', capim: 'capim', pena: 'pena', musgo: 'musgo', barbante: 'barbante (lixo)', plastico: 'plástico (lixo)' };
const BEAM_GEO = new THREE.CylinderGeometry(0.05, 0.17, 3.3, 10, 1, true);
const ITEM_NOME = { graveto: 'o graveto', capim: 'o capim', musgo: 'o musgo', pena: 'a pena', barbante: 'o barbante', plastico: 'o plástico', inseto: 'o inseto', peixe: 'o peixe', pitanga: 'a pitanga' };
function ninhoStage() {
  const items = [];
  const S = { structure: 0, lining: 0, quality: 1, trash: 0, time: 0, done: false, doneT: 0, delivered: false, spawnT: 0.3 };
  let pirate = null, pirateDone = false, mState = 'perch', mT = 4, mGoal = null;
  const nestTarget = { obj: NESTM.approach, kind: 'ninho', bonus: 16 };
  // armed = pode ser pego ao passar por cima (um item solto só volta a valer depois que o pássaro se afasta)
  // Cada material ganha um feixe de luz: amarelo = estrutura, azul = forro, vermelho = lixo.
  function addItem(kind, p, fromY, armed = true) {
    const g = new THREE.Group(), mesh = makeItem(kind); mesh.scale.setScalar(1.5); g.add(mesh);
    const ring = ringMarker(g, 0.5); ring.material.color.setHex(ITEM_COR[kind]); ring.material.blending = THREE.AdditiveBlending;
    const beam = new THREE.Mesh(BEAM_GEO, new THREE.MeshBasicMaterial({ color: ITEM_COR[kind], transparent: true, opacity: 0.3, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, fog: false }));
    beam.position.y = 1.65; g.add(beam);
    const it = { kind, g, mesh, ring, beam, obj: g, falling: fromY != null, t: rand(0, 6), ground: groundY(p.x, p.z) + 0.09, armed, vy: 0 };
    g.position.set(p.x, fromY != null ? fromY : it.ground, p.z); ring.visible = !it.falling;
    SG.add(g); items.push(it);
    return it;
  }
  function relevancia(kind) { // 1 = o ninho precisa disso agora
    if (TRASH.includes(kind)) return S.structure < 10 ? 0.55 : 0.15;
    if (RIGID.includes(kind)) return S.structure < 10 ? 1 : 0.2;
    return S.structure >= 5 && S.lining < 3 ? 1 : 0.25;
  }
  function spawn(force) {
    const r = Math.random();
    const kind = force || (r < 0.27 ? 'graveto' : r < 0.52 ? 'capim' : r < 0.64 ? 'pena' : r < 0.76 ? 'musgo' : r < 0.88 ? 'barbante' : 'plastico');
    let p;
    if (TRASH.includes(kind)) { const l = pick(LIXEIRAS), a = rand(0, Math.PI * 2), d = rand(0.8, 1.6); p = V(l.x + Math.cos(a) * d, 0, l.z + Math.sin(a) * d); }
    else p = grassPoint();
    addItem(kind, p, kind === 'pena' ? rand(7, 10) : null);
  }
  function dropCarry() {
    if (!P.carry) return;
    addItem(P.carry, P.pos, P.pos.y - 0.08, false);
    setCarry(P, null); SFX.splash();
  }
  function needed() {
    if (S.structure >= 5 && S.lining < 3 && !items.some(i => SOFT.includes(i.kind))) return pick(SOFT);
    if (S.structure < 10 && items.filter(i => i.kind === 'graveto' || i.kind === 'capim').length < 2) return pick(['graveto', 'capim']);
    return null;
  }
  function deliver() {
    const k = P.carry;
    if (RIGID.includes(k)) {
      if (S.structure >= 10) { toast('A estrutura está pronta. Solte isso e traga penas ou musgo para o forro!', 'orange', 2.6, 'estrutura-ok'); return; }
      S.structure++; setCarry(P, null); SFX.drop();
      if (TRASH.includes(k)) { S.trash++; S.quality = Math.max(0.4, S.quality - 0.1); toast(k === 'plastico' ? 'Plástico segura o ninho, mas pode machucar os filhotes.' : 'Barbante pode enroscar nas patas dos filhotes!', 'red', 2.8); }
    } else {
      if (S.structure < 5) { toast('Primeiro a base: solte isso e traga gravetos e capim.', 'orange', 2.6, 'base-primeiro'); return; }
      if (S.lining >= 3) { toast('O forro já está macio!', 'orange', 2.2, 'forro-ok'); return; }
      S.lining++; setCarry(P, null); SFX.drop();
    }
    S.delivered = true; P.follow = null; P.target = P.pos.clone(); P.landing = false;
  }
  return {
    S, items, get pirate() { return pirate; },
    enter() {
      showOnly('hud', 'hint');
      setHud('ETAPA 2 · CONSTRUIR O NINHO', `<div class="meter">Estrutura <div class="bar"><i id="h-str" style="--c:#8f6a3e"></i></div></div><div class="meter">Forro <div class="bar sm" style="width:40px"><i id="h-lin" style="--c:#8cc46a"></i></div></div><div class="meter tabnum" id="h-q"></div>`);
      NESTM.set(0, 0, 0); NESTM.setChicks(0);
      marker.visible = true;
      const start = V(4.5, 2.6, -1.2);
      place(P, start, yawTo(start, NEST)); P.landing = false;
      M.m.root.visible = true; place(M, lampTop(), yawTo(LAMP, NEST));
      followCam(yawTo(NEST, start)); cam.pitch = 0.36;
      ['graveto', 'capim', 'graveto', 'capim', 'plastico', 'musgo'].forEach(k => spawn(k));
    },
    update(dt) {
      if (!S.done) S.time += dt;
      S.spawnT -= dt;
      if (S.spawnT <= 0 && items.length < 9) { spawn(needed()); S.spawnT = 1.6; }
      for (const it of items) {
        it.t += dt;
        if (it.falling) {
          if (it.kind === 'pena') { it.g.position.y -= 0.7 * dt; it.g.position.x += Math.sin(it.t * 1.6) * 0.5 * dt; it.mesh.rotation.z = Math.sin(it.t * 2) * 0.5; }
          else { it.vy = Math.min(it.vy + 9.8 * dt, 8); it.g.position.y -= it.vy * dt; it.mesh.rotation.x += dt * 7; }
          if (it.g.position.y <= it.ground) { it.g.position.y = it.ground; it.falling = false; it.ring.visible = true; it.mesh.rotation.set(0, it.mesh.rotation.y, 0); }
        } else { it.mesh.position.y = 0.08 + Math.sin(it.t * 3) * 0.05; it.mesh.rotation.y += dt * 1.2; }
        const rel = relevancia(it.kind) * (it.armed ? 1 : 0.4), pulso = 0.5 + 0.5 * Math.sin(it.t * 4);
        it.ring.material.opacity = (0.35 + 0.45 * pulso) * rel;
        it.ring.scale.setScalar(1 + 0.25 * pulso);
        it.beam.material.opacity = (0.16 + 0.14 * pulso) * rel;
        if (!it.armed && it.g.position.distanceTo(P.pos) > 1.0) it.armed = true;
      }
      updateFlyer(P, dt);
      if (!S.done) {
        // passar por cima pega; se já estiver carregando algo, só troca quando o item foi escolhido com um toque
        const chosen = it => P.follow && P.follow.obj === it.obj;
        const i = items.findIndex(it => it.g.position.distanceTo(P.pos) < 0.6 && (it.armed || chosen(it)) && (!P.carry || chosen(it)));
        if (i >= 0) {
          const it = items[i], old = P.carry;
          it.dead = true; SG.remove(it.g); items.splice(i, 1);
          if (old) addItem(old, P.pos, P.pos.y - 0.08, false);
          setCarry(P, it.kind); SFX.pick(); hover(P);
          if (old) toast(`Trocou ${ITEM_NOME[old]} por ${ITEM_NOME[it.kind]}.`, 'ink', 1.8);
        }
      }
      const ap = NESTM.approach.getWorldPosition(V());
      if (P.carry && ap.distanceTo(P.pos) < 0.85) deliver();
      // parceiro
      mT -= dt;
      if (mState === 'perch' && mT <= 0 && S.structure < 10 && !S.done) { mState = 'go'; mGoal = grassPoint(); flyTo(M, mGoal.clone().add(V(0, PERCH_H, 0)), true); }
      else if (mState === 'go' && M.perched) { setCarry(M, pick(['graveto', 'capim'])); mState = 'return'; M.follow = { obj: NESTM.approach }; }
      else if (mState === 'return' && M.pos.distanceTo(ap) < 0.5) { if (S.structure < 10) { S.structure++; SFX.drop(); } setCarry(M, null); mState = 'back'; flyTo(M, lampTop(), true); }
      else if (mState === 'back' && M.perched) { mState = 'perch'; mT = rand(6, 9); M.faceYaw = yawTo(M.pos, NEST); }
      updateFlyer(M, dt);
      // ladrão de ninho
      if (!pirateDone && !pirate && S.structure >= 6 && !S.done) {
        pirate = makeFlyer(makeBird('pirata', 0.85), 4.5); SG.add(pirate.m.root);
        place(pirate, V(-20, 13, -24)); pirate.follow = { obj: NESTM.top }; pirate.state = 'come'; pirate.stealT = 1.4;
        toast('Um bem-te-vi-pirata quer roubar o ninho! Toque nele para expulsar.', 'red', 3.2); SFX.alarm();
      }
      if (pirate) {
        const tp = NESTM.top.getWorldPosition(V());
        if (pirate.state === 'come' && pirate.pos.distanceTo(tp) < 0.15) { pirate.state = 'steal'; pirate.follow = null; pirate.target = tp; pirate.landing = true; }
        if (pirate.state === 'steal') {
          pirate.stealT -= dt; pirate.faceYaw = Math.atan2(NEST_DIR.x, NEST_DIR.z);
          if (pirate.stealT <= 0) { pirate.stealT = 1.5; if (S.structure > 3) { S.structure--; toast('O pirata está arrancando o ninho!', 'red', 2, 'pirata-rouba'); } }
        }
        if (pirate.state !== 'flee' && (S.done || pirate.pos.distanceTo(P.pos) < 0.6)) {
          pirate.state = 'flee'; pirate.follow = null; flyTo(pirate, V(-34, 18, -34)); pirate.maxV = 7;
          SFX.hit(); P.crest = 1.3; G.repelled++; toast('Fora, pirata! O ninho é nosso.', 'green', 2.2);
          if (P.follow && P.follow.obj === pirate.m.root) P.follow = null;
        }
        updateFlyer(pirate, dt, pirate.state !== 'flee');
        if (pirate.state === 'flee' && pirate.pos.distanceTo(V(-34, 18, -34)) < 1.5) { SG.remove(pirate.m.root); pirate.dead = true; pirate = null; pirateDone = true; }
      }
      NESTM.set(S.structure / 10, S.lining, S.trash);
      if (!S.done && S.structure >= 10 && S.lining >= 3) { S.done = true; SFX.win(); toast('Ninho pronto: uma bola de capim com porta lateral!', 'green', 3); }
      if (S.done) { S.doneT += dt; if (S.doneT > 2.8) { G.quality = S.quality; G.trash = S.trash; G.nestTime = S.time; go(card3()); } }
    },
    ui() {
      setW(document.getElementById('h-str'), S.structure / 10); setW(document.getElementById('h-lin'), S.lining / 3);
      const q = document.getElementById('h-q'); if (q) { setText(q, `Qualidade ${Math.round(S.quality * 100)}%`); q.style.color = S.quality < 1 ? '#d8402a' : '#2e8a52'; }
      setText(UI.hudRight, `${Math.floor(S.time)} s`);
      const ap = NESTM.approach.getWorldPosition(V());
      if (P.carry || !S.delivered) { if (!markArrow(ap, '#ffd21f')) markTag(ap, 'ninho', '#ffd21f', 26); }
      if (pirate && pirate.state !== 'flee') { if (!markArrow(pirate.pos, '#d8402a')) markTag(pirate.pos, 'pirata', '#ff9b8a', 26); }
      // etiquetas nos materiais mais próximos
      items.filter(it => it.g.position.distanceTo(P.pos) < 10 && relevancia(it.kind) > 0.3)
        .sort((a, b) => a.g.position.distanceTo(P.pos) - b.g.position.distanceTo(P.pos)).slice(0, 4)
        .forEach(it => markTag(it.g.position.clone().add(V(0, 0.45, 0)), ITEM_ROTULO[it.kind], ITEM_TAG[it.kind], 4));
      if (P.carry) setHint(`Carregando ${ITEM_NOME[P.carry]}`, [{ label: 'Soltar', alt: true, fn: dropCarry }, { label: 'Levar ao ninho', fn: () => { P.follow = nestTarget; P.landing = false; } }]);
      else if (S.structure < 5) setHint('Base do ninho: pegue gravetos e capim (luz amarela). Luz vermelha é lixo.');
      else if (S.structure < 10) setHint('Mais gravetos e capim (luz amarela). Penas e musgo (luz azul) já servem para o forro.');
      else setHint('Agora o forro: penas e musgo (luz azul).');
    },
    onKey(k) { if (k === 'drop') dropCarry(); },
    onTap(sx, sy) {
      const list = items.map(it => ({ obj: it.obj, it, bonus: 6 }));
      list.push(nestTarget);
      if (pirate && pirate.state !== 'flee') list.push({ obj: pirate.m.root, bonus: 20 });
      const c = pickTarget(sx, sy, list);
      if (c) { P.follow = c; P.landing = false; P.faceYaw = null; return; }
      tapWorld(sx, sy);
    }
  };
}

// ---------- ETAPA 3: filhotes ----------
const VAL = { inseto: 0.4, peixe: 1.0, pitanga: 0.3 };
const NOMES = { tucano: 'O tucano', gaviao: 'O gavião', gato: 'O gato' };
function filhotesStage() {
  const N = G.eggs, DAY = 7, DAYS = 18;
  const chicks = Array.from({ length: N }, () => ({ alive: true, left: false, hunger: 0.85, weakT: 0, beg: 0 }));
  const insects = [], fruits = [], preds = [], fledgers = [], debris = [];
  let fish = null, fishT = 2.5, fruitT = 0, day = 1, dayT = 0, predT = 11, predI = 0, ending = null, endT = 0, chirpT = 1;
  let mState = 'rest', mRest = 2, mTarget = null;
  const decay = (1 / 45) * (1 + (1 - G.quality));
  const growth = () => clamp((day - 1 + dayT / DAY) / DAYS, 0, 1);
  const alive = () => chicks.filter(c => c.alive);
  const nestTarget = { obj: NESTM.approach, kind: 'ninho', bonus: 16 };
  const ORDER = ['tucano', 'gaviao', 'gato'];
  function spawnInsect(at) {
    const near = insects.filter(i => i.q[0] === 1 && i.q[1] === -1).length < 2;
    const g = makeInsect(), q = at ? [Math.sign(at.x) || 1, Math.sign(at.z) || 1] : near ? [1, -1] : [pick([-1, 1]), pick([-1, 1])];
    if (at) g.position.copy(at); else g.position.set(q[0] * rand(3, 15), rand(1, 3.6), q[1] * rand(3, 15));
    const it = { g, obj: g, vel: V(rand(-1, 1), rand(-0.3, 0.3), rand(-1, 1)), q, t: rand(0, 6) };
    SG.add(g); insects.push(it);
  }
  function feed(value) {
    let v = value;
    for (const c of alive().sort((a, b) => a.hunger - b.hunger)) { if (v <= 0) break; const give = Math.min(1 - c.hunger, v); c.hunger += give; v -= give; }
    SFX.drop();
  }
  function dropFood() { // inseto solto foge voando; fruta e peixe caem
    const k = P.carry; if (!k) return;
    setCarry(P, null);
    if (k === 'inseto') { spawnInsect(P.pos.clone()); return; }
    const m = makeItem(k); m.scale.setScalar(1.3); m.position.copy(P.pos); SG.add(m); debris.push({ obj: m, vy: 0 });
  }
  function spawnPred(type) {
    const ap = NESTM.approach.getWorldPosition(V());
    const p = { type, hp: type === 'gaviao' ? 2 : 3, state: 'come', flash: 0, atkT: 0, atkMax: type === 'gaviao' ? 2.2 : 2.6, r: type === 'gaviao' ? 0.75 : 0.6 };
    if (type === 'tucano') {
      p.model = makeToucan(); const a = rand(0, Math.PI * 2); p.model.root.position.set(ap.x + Math.cos(a) * 26, rand(9, 13), ap.z + Math.sin(a) * 26);
      toast('Um tucano quer os filhotes! Toque nele para atacar.', 'red', 3);
    } else if (type === 'gaviao') {
      p.model = makeHawk(); p.model.root.position.set(rand(-20, 20), 22, -34); p.state = 'circle'; p.ang = rand(0, 6); p.circT = 3.4;
      toast('Um gavião está circulando a praça!', 'red', 3);
    } else {
      p.model = makeCat(); const side = pick([V(24, 0, -7), V(9, 0, -24), V(24, 0, -14)]);
      p.path = [side, V(TREE.x + NEST_DIR.x * 0.42, groundY(TREE.x, TREE.z), TREE.z + NEST_DIR.z * 0.42), V(TREE.x + NEST_DIR.x * 0.42, 3.9, TREE.z + NEST_DIR.z * 0.42), ap.clone().add(V(0, -0.35, 0))];
      p.len = 0; for (let i = 0; i < p.path.length - 1; i++) p.len += p.path[i].distanceTo(p.path[i + 1]);
      p.s = 0; p.state = 'climb';
      toast('Um gato está vindo subir na árvore!', 'red', 3);
    }
    p.obj = p.model.root; p.pos = p.model.root.position;
    preds.push(p); SFX.alarm();
  }
  function catAt(p) {
    let s = clamp(p.s, 0, p.len);
    for (let i = 0; i < p.path.length - 1; i++) {
      const a = p.path[i], b = p.path[i + 1], d = a.distanceTo(b);
      if (s <= d || i === p.path.length - 2) { const u = clamp(s / d, 0, 1); p.pos.copy(a).lerp(b, u); return tmpA.copy(b).sub(a).normalize(); }
      s -= d;
    }
    return tmpA.set(0, 0, 1);
  }
  function tryHit(F, p, cd) {
    if (p.state === 'flee' || F.hitCD > 0 || F.pos.distanceTo(p.pos) > p.r + 0.25) return;
    F.hitCD = cd; F.crest = 1.3; p.hp--; p.flash = 0.25; SFX.hit();
    tmpB.copy(F.pos).sub(p.pos).normalize(); F.vel.copy(tmpB).multiplyScalar(5);
    if (p.hp <= 0) { p.state = 'flee'; G.repelled++; toast(`${NOMES[p.type]} desistiu e foi embora!`, 'green', 2.4); if (P.follow && P.follow.obj === p.obj) P.follow = null; }
    else { p.state = 'knock'; p.knockT = 0.7; p.atkT = 0; }
  }
  function startEnding() {
    ending = alive().length ? 'voo' : 'perda'; endT = 0;
    preds.forEach(p => { p.state = 'flee'; });
    if (ending === 'voo') {
      SFX.win(); toast('Dia 18: hora do primeiro voo!', 'green', 3.2);
      const hp = NESTM.approach.getWorldPosition(V());
      alive().forEach((c, i) => {
        const f = makeFlyer(makeBird('btv', 0.68), 3); SG.add(f.m.root);
        place(f, hp.clone()); f.landing = true; f.delay = 0.4 + i * 0.5; f.c = c; f.seat = duetSeat(0.15 + i * 0.2).add(V(0, -0.06, 0));
        f.m.root.visible = false; fledgers.push(f);
      });
    } else { SFX.sad(); toast('Nenhum filhote sobreviveu desta vez…', 'red', 3); }
  }
  return {
    chicks, preds, insects, fruits, get fish() { return fish; }, get day() { return day; },
    enter() {
      showOnly('hud', 'hint');
      setHud('ETAPA 3 · ALIMENTAR E PROTEGER', `<div id="h-chicks" style="display:flex;gap:10px"></div><div class="meter" style="margin-left:auto"><div class="bar" style="width:64px"><i id="h-day" style="--c:#ffd21f"></i></div></div>`);
      document.getElementById('h-chicks').innerHTML = chicks.map((c, i) => `<span class="chick" id="h-c${i}"><b></b><span class="bar sm"><i></i></span></span>`).join('');
      NESTM.set(1, 3, G.trash); NESTM.setChicks(N);
      marker.visible = true;
      const start = V(4.5, 3, -1.5); place(P, start, yawTo(start, NEST)); P.landing = false;
      M.m.root.visible = true; place(M, lampTop(), yawTo(LAMP, NEST));
      followCam(yawTo(NEST, start)); cam.pitch = 0.36;
      for (let i = 0; i < 5; i++) spawnInsect();
      FRUITS.forEach(p => { const m = makeItem('pitanga'); m.scale.setScalar(1.3); m.position.copy(p); SG.add(m); fruits.push({ obj: m, on: true }); });
    },
    exit() { NESTM.alert.visible = false; },
    update(dt) {
      const ap = NESTM.approach.getWorldPosition(V());
      if (!ending) {
        dayT += dt;
        if (dayT >= DAY) { dayT -= DAY; day++; if (day > DAYS) { day = DAYS; dayT = DAY; startEnding(); } else toast(`Dia ${day} de ${DAYS}`, 'ink', 1.4, 'dia'); }
        const underAttack = preds.some(p => p.state === 'attack');
        for (const c of chicks) {
          if (!c.alive) continue;
          c.hunger = Math.max(0, c.hunger - decay * dt * (underAttack ? 2 : 1));
          c.beg = lerp(c.beg, (c.hunger < 0.6 || (P.carry && P.pos.distanceTo(ap) < 3)) ? 1 : 0, damp(6, dt));
          if (c.hunger <= 0) { c.weakT += dt; if (c.weakT > 10) { c.alive = false; toast('Um filhote ficou fraco demais e não resistiu.', 'red', 3); SFX.sad(); } }
          else c.weakT = 0;
        }
        if (alive().some(c => c.hunger < 0.25)) toast('Os filhotes estão com muita fome! Traga comida para o ninho.', 'orange', 2.6, 'fome');
        chirpT -= dt; if (chirpT <= 0) { chirpT = rand(0.7, 1.5); if (alive().some(c => c.hunger < 0.45)) SFX.chick(); }
        if (alive().length === 0) startEnding();
      }
      const gr = growth();
      chicks.forEach((c, i) => { const m = NESTM.chicks[i]; if (!m) return; m.g.visible = c.alive && !c.left; m.set(c.beg * (0.75 + 0.25 * Math.sin(clock * 16 + i)), gr); });
      // comida
      if (insects.length < 5 && Math.random() < dt * 0.8) spawnInsect();
      for (const it of insects) {
        it.t += dt; it.vel.x += rand(-3, 3) * dt; it.vel.y += rand(-1.5, 1.5) * dt; it.vel.z += rand(-3, 3) * dt;
        if (it.vel.length() > 1.7) it.vel.setLength(1.7);
        it.g.position.addScaledVector(it.vel, dt);
        const p = it.g.position, [qx, qz] = it.q;
        if (p.x * qx < 2.5 || p.x * qx > 16) { it.vel.x *= -1; p.x = qx * clamp(p.x * qx, 2.5, 16); }
        if (p.z * qz < 2.5 || p.z * qz > 16) { it.vel.z *= -1; p.z = qz * clamp(p.z * qz, 2.5, 16); }
        if (p.y < 0.9 || p.y > 4) { it.vel.y *= -1; p.y = clamp(p.y, 0.9, 4); }
        it.g.rotation.y = Math.atan2(it.vel.x, it.vel.z);
        for (const w of it.g.userData.wings) w.piv.rotation.z = w.s * Math.sin(clock * 60 + it.t) * 0.7;
      }
      fishT -= dt;
      if (!fish && fishT <= 0) {
        const a = rand(0, Math.PI * 2), d = rand(1.0, 2.6), a2 = a + rand(-0.6, 0.6);
        const m = makeItem('peixe'); m.scale.setScalar(1.5); SG.add(m);
        fish = { obj: m, from: V(Math.cos(a) * d, WATER_Y - 0.1, Math.sin(a) * d), to: V(Math.cos(a2) * (d * 0.6), WATER_Y - 0.1, Math.sin(a2) * (d * 0.6)), t: 0, dur: 1.7, h: rand(1.5, 2.1) };
        fishT = rand(2.6, 4.4); SFX.splash();
      }
      if (fish) {
        fish.t += dt; const u = fish.t / fish.dur;
        fish.obj.position.copy(fish.from).lerp(fish.to, u); fish.obj.position.y += Math.sin(Math.PI * u) * fish.h;
        fish.obj.lookAt(tmpA.copy(fish.to).lerp(fish.from, 0).add(V(0, Math.cos(Math.PI * u) * fish.h * 2, 0)));
        if (u >= 1) { SG.remove(fish.obj); fish.dead = true; fish = null; }
      }
      fruitT += dt; if (fruitT > 5) { fruitT = 0; const f = fruits.find(f => !f.on); if (f) { f.on = true; f.obj.visible = true; f.dead = false; } }
      // jogador
      updateFlyer(P, dt);
      if (!ending) {
        // sem nada no bico, pega o que tocar; carregando, só troca pela comida escolhida com um toque
        const want = o => !P.carry || (P.follow && P.follow.obj === o);
        let got = null;
        const ii = insects.findIndex(i => want(i.obj) && i.g.position.distanceTo(P.pos) < 0.55);
        if (ii >= 0) { const it = insects[ii]; it.dead = true; SG.remove(it.g); insects.splice(ii, 1); got = 'inseto'; }
        else if (fish && want(fish.obj) && fish.obj.position.distanceTo(P.pos) < 0.6) { SG.remove(fish.obj); fish.dead = true; fish = null; got = 'peixe'; }
        else { const f = fruits.find(f => f.on && want(f.obj) && f.obj.position.distanceTo(P.pos) < 0.55); if (f) { f.on = false; f.obj.visible = false; f.dead = true; got = 'pitanga'; } }
        if (got) { if (P.carry) dropFood(); setCarry(P, got); SFX.pick(); hover(P); }
      }
      for (let i = debris.length - 1; i >= 0; i--) {
        const d = debris[i]; d.vy += 9.8 * dt; d.obj.position.y -= d.vy * dt; d.obj.rotation.x += dt * 6;
        if (d.obj.position.y < groundY(d.obj.position.x, d.obj.position.z) + 0.05) { SG.remove(d.obj); debris.splice(i, 1); }
      }
      if (P.carry && !ending && P.pos.distanceTo(ap) < 0.85) { feed(VAL[P.carry]); setCarry(P, null); P.follow = null; P.target = P.pos.clone(); P.landing = false; }
      // parceiro
      const threat = preds.find(p => p.state !== 'flee');
      if (threat && !ending) { M.follow = { obj: threat.obj }; M.landing = false; mState = 'defend'; }
      else if (mState === 'defend') { mState = 'rest'; mRest = 1; flyTo(M, lampTop(), true); }
      else if (mState === 'rest') { mRest -= dt; if (mRest <= 0 && !ending && insects.length) { mState = 'hunt'; mTarget = insects.slice().sort((a, b) => a.g.position.distanceTo(M.pos) - b.g.position.distanceTo(M.pos))[0]; M.follow = mTarget; M.landing = false; } }
      else if (mState === 'hunt') {
        if (!mTarget || mTarget.dead) { mState = 'rest'; mRest = 0.5; M.follow = null; M.target = M.pos.clone(); }
        else if (mTarget.g.position.distanceTo(M.pos) < 0.55) { mTarget.dead = true; SG.remove(mTarget.g); insects.splice(insects.indexOf(mTarget), 1); setCarry(M, 'inseto'); mState = 'carry'; M.follow = { obj: NESTM.approach }; }
      } else if (mState === 'carry' && M.pos.distanceTo(ap) < 0.5) { if (!ending) feed(VAL.inseto); setCarry(M, null); mState = 'rest'; mRest = rand(1, 2); flyTo(M, lampTop(), true); }
      updateFlyer(M, dt);
      // predadores
      predT -= dt;
      if (!ending && predT <= 0 && day >= 2) {
        if (preds.filter(p => p.state !== 'flee').length < (day >= 12 ? 2 : 1)) spawnPred(ORDER[predI++ % 3]);
        predT = rand(13, 18) - Math.min(4, day * 0.2);
      }
      for (const p of preds) {
        p.flash = Math.max(0, p.flash - dt);
        p.model.mats.forEach(m => m.emissive.setHex(p.flash > 0 ? 0x993322 : 0x000000));
        const r = p.model.root;
        if (p.type === 'tucano' || p.type === 'gaviao') {
          const speed = p.type === 'tucano' ? 2.4 : 9;
          let goal = null;
          if (p.state === 'circle') {
            p.ang += dt * 0.8; p.circT -= dt;
            goal = V(NEST.x - 3 + Math.cos(p.ang) * 7, 11, NEST.z + 3 + Math.sin(p.ang) * 7);
            r.position.lerp(goal, damp(1.5, dt));
            if (p.circT <= 0) { p.state = 'come'; toast('O gavião vai mergulhar!', 'red', 1.8, 'mergulho'); }
          } else if (p.state === 'come') {
            const d = ap.distanceTo(r.position);
            r.position.addScaledVector(tmpA.copy(ap).sub(r.position).normalize(), Math.min(d, speed * dt));
            if (d < 0.3) { p.state = 'attack'; p.atkT = p.atkMax; }
          } else if (p.state === 'knock') {
            r.position.addScaledVector(tmpA.copy(r.position).sub(ap).setY(0).normalize(), 3 * dt); r.position.y += 2.5 * dt;
            p.knockT -= dt; if (p.knockT <= 0) { if (p.type === 'gaviao') { p.state = 'circle'; p.circT = 2.4; } else p.state = 'come'; }
          } else if (p.state === 'flee') { r.position.addScaledVector(tmpA.copy(r.position).sub(ap).setY(0).normalize(), 7 * dt); r.position.y += 3 * dt; }
          const vel = tmpB.copy(p.state === 'circle' && goal ? goal : ap).sub(r.position);
          if (p.state === 'flee' || p.state === 'knock') vel.negate();
          if (Math.hypot(vel.x, vel.z) > 0.1) r.rotation.y = lerpAngle(r.rotation.y, Math.atan2(vel.x, vel.z), damp(6, dt));
          const tucked = p.type === 'gaviao' && p.state === 'come';
          p.model.body.rotation.x = tucked ? 0.6 : 0;
          for (const w of p.model.wings) {
            w.piv.rotation.z = w.s * (tucked ? -0.25 : (p.state === 'attack' ? Math.sin(clock * 10) * 0.3 : Math.sin(clock * (p.type === 'gaviao' ? 5 : 14)) * 0.8));
            w.piv.scale.x = tucked ? 0.5 : 1;
            if (w.hand) w.hand.rotation.z = w.s * Math.sin(clock * (p.type === 'gaviao' ? 5 : 14) - 0.6) * 0.35;
          }
          if (p.model.garras) p.model.garras.visible = tucked || p.state === 'attack';
        } else {
          if (p.state === 'climb') { p.s += (p.s < p.path[0].distanceTo(p.path[1]) ? 1.8 : 0.85) * dt; if (p.s >= p.len) { p.s = p.len; p.state = 'attack'; p.atkT = p.atkMax; } }
          else if (p.state === 'knock') { p.s = Math.max(0, p.s - 3.5 * dt); p.knockT -= dt; if (p.knockT <= 0) p.state = 'climb'; }
          else if (p.state === 'flee') p.s -= 4 * dt;
          const d = catAt(p);
          const hz = Math.hypot(d.x, d.z);
          if (hz > 0.2) r.rotation.y = Math.atan2(d.x, d.z) + (p.state === 'flee' || p.state === 'knock' ? Math.PI : 0);
          r.rotation.x = -Math.atan2(d.y, Math.max(hz, 1e-3)) * (p.state === 'flee' || p.state === 'knock' ? -1 : 1);
          p.model.legs.forEach((l, i) => { l.rotation.x = Math.sin(clock * 12 + i * Math.PI / 2) * 0.6; });
        }
        if (p.state === 'attack') {
          p.atkT -= dt;
          if (p.atkT <= 0) { const live = alive(); if (live.length) { pick(live).alive = false; toast(`${NOMES[p.type]} levou um filhote…`, 'red', 3); SFX.sad(); } p.state = 'flee'; }
        }
        if (!ending) { tryHit(P, p, 0.45); tryHit(M, p, 1.4); }
      }
      for (let i = preds.length - 1; i >= 0; i--) {
        const p = preds[i];
        if (p.state === 'flee' && ((p.type === 'gato' && p.s <= 0) || (p.type !== 'gato' && p.pos.distanceTo(ap) > 30))) { SG.remove(p.model.root); p.dead = true; preds.splice(i, 1); }
      }
      NESTM.alert.visible = preds.some(p => p.state === 'attack');
      if (NESTM.alert.visible) NESTM.alert.scale.setScalar(1 + Math.sin(clock * 10) * 0.08);
      // ciclo do dia
      const tod = 0.5 - 0.5 * Math.cos(2 * Math.PI * dayT / DAY);
      sun.intensity = 0.55 + 0.35 * tod; hemi.intensity = 0.7 + 0.2 * tod;
      SKY.material.color.setRGB(1, lerp(0.84, 1, tod), lerp(0.72, 1, tod));
      // fim
      if (ending) {
        endT += dt;
        for (const f of fledgers) {
          if (endT > f.delay && !f.m.root.visible) { f.m.root.visible = true; f.c.left = true; flyTo(f, f.seat, true); f.faceYaw = yawTo(DUET_A, DUET_B) + Math.PI / 2; }
          if (f.m.root.visible) updateFlyer(f, dt);
        }
        if (endT > (ending === 'voo' ? 5 : 3.2)) { G.fledged = alive().length; go(finalStage()); }
      }
    },
    ui() {
      chicks.forEach((c, i) => {
        const el = document.getElementById('h-c' + i); if (!el) return;
        el.classList.toggle('lost', !c.alive);
        const bar = el.querySelector('i'); setW(bar, c.alive ? c.hunger : 0);
        bar.style.background = c.hunger > 0.5 ? '#3fae6a' : c.hunger > 0.25 ? '#ff8c42' : '#d8402a';
      });
      setW(document.getElementById('h-day'), (day - 1 + dayT / DAY) / DAYS);
      setText(UI.hudRight, `Dia ${day}/${DAYS}`);
      const ap = NESTM.approach.getWorldPosition(V());
      for (const p of preds) if (p.state !== 'flee') { if (!markArrow(p.pos, '#d8402a')) markTag(p.pos, p.state === 'attack' ? 'atacando!' : NOMES[p.type].slice(2), '#ff9b8a', 30); }
      if (P.carry) { if (!markArrow(ap, '#ffd21f')) markTag(ap, 'ninho', '#ffd21f', 26); }
      const threat = preds.find(p => p.state !== 'flee');
      if (ending) setHint(ending === 'voo' ? 'Primeiro voo!' : 'Fim da estação');
      else if (P.carry) setHint(`Carregando ${ITEM_NOME[P.carry]}`, [{ label: 'Soltar', alt: true, fn: dropFood }, { label: 'Levar ao ninho', fn: () => { P.follow = nestTarget; P.landing = false; } }]);
      else if (threat) setHint('', [{ label: `Atacar ${NOMES[threat.type].toLowerCase()}`, fn: () => { P.follow = { obj: threat.obj }; P.landing = false; } }]);
      else setHint('Toque em insetos, peixes ou pitangas para caçar.');
    },
    onKey(k) { if (k === 'drop') dropFood(); },
    onTap(sx, sy) {
      if (ending) return;
      const list = [];
      insects.forEach(i => list.push({ obj: i.obj, bonus: 10, ref: i }));
      if (fish) list.push({ obj: fish.obj, bonus: 14 });
      fruits.forEach(f => { if (f.on) list.push({ obj: f.obj, bonus: 4 }); });
      list.push(nestTarget);
      preds.forEach(p => { if (p.state !== 'flee') list.push({ obj: p.obj, bonus: 24 }); });
      const c = pickTarget(sx, sy, list);
      if (c) { P.follow = c; P.landing = false; P.faceYaw = null; return; }
      tapWorld(sx, sy);
    }
  };
}

// ---------- fim da estação ----------
function finalStage() {
  const N = G.eggs, F = G.fledged;
  const stars = F === N ? 3 : F >= Math.ceil(N / 2) ? 2 : F >= 1 ? 1 : 0;
  let best = 0;
  try { best = +localStorage.getItem('btv-recorde') || 0; if (stars > best) localStorage.setItem('btv-recorde', String(stars)); } catch (e) {}
  const young = [];
  return {
    enter() {
      sun.intensity = 0.7; hemi.intensity = 0.8; SKY.material.color.setRGB(1, 0.86, 0.76);
      NESTM.setChicks(0);
      place(P, duetSeat(0.7), yawTo(DUET_B, DUET_A) + 0.5); M.m.root.visible = true; place(M, duetSeat(0.58), yawTo(DUET_B, DUET_A) + 0.7); marker.visible = false;
      for (let i = 0; i < F; i++) { const f = makeFlyer(makeBird('btv', 0.68)); SG.add(f.m.root); place(f, duetSeat(0.29 + i * 0.075).add(V(0, -0.04, 0)), yawTo(DUET_A, DUET_B) + Math.PI / 2); young.push(f); }
      { // família no galho, vista do lado da praça (fora da copa da árvore)
        const mid = duetSeat(0.5), dir = DUET_B.clone().sub(DUET_A), n = V(-dir.z, 0, dir.x).normalize(); // grupo ocupa t = 0,29 a 0,70
        if (n.z < 0) n.negate();
        cam.mode = 'fixed'; cam.fixedPos.copy(mid).addScaledVector(n, 3.6).add(V(0, 0.7, 0)); cam.fixedLook.copy(mid).add(V(0, -0.55, 0));
        camera.position.copy(cam.fixedPos); camLook.copy(cam.fixedLook);
      }
      showCard({
        low: true, eyebrow: `Dezembro · estação ${G.season}`, title: 'Fim da estação', stars,
        rows: [
          ['Parceiro', `conquistado com ${G.lives} ${G.lives === 1 ? 'vida' : 'vidas'}`],
          ['Ninho', `${Math.round(G.quality * 100)}% de qualidade em ${Math.round(G.nestTime)} s`],
          ['Ovos', `${N}`],
          ['Filhotes que voaram', `${F} de ${N}`],
          ['Predadores espantados', `${G.repelled}`],
          ['Recorde', `${Math.max(best, stars)} ${Math.max(best, stars) === 1 ? 'estrela' : 'estrelas'}`]
        ],
        body: F === N ? 'Todos os filhotes voaram! Logo cada um vai procurar o próprio território, e o ciclo recomeça.'
          : F > 0 ? 'Alguns filhotes voaram. Na natureza é assim: nem todos chegam ao primeiro voo.'
          : 'Nenhum filhote voou desta vez. O casal vai tentar de novo na próxima estação.',
        button: 'Nova estação',
        next: () => { Object.assign(G, { lives: 3, eggs: 3, quality: 1, trash: 0, nestTime: 0, fledged: 0, repelled: 0, season: G.season + 1 }); sun.intensity = 0.8; hemi.intensity = 0.85; SKY.material.color.setRGB(1, 1, 1); go(card1()); }
      });
    },
    update(dt) { updateFlyer(P, dt); updateFlyer(M, dt); young.forEach(f => updateFlyer(f, dt)); }
  };
}

// ---------- laço principal ----------
function animateWorld(dt) {
  FOUNTAIN.update(dt); VENTO.value += dt;
  for (const c of CLOUDS) { c.position.x += dt * 1.3; if (c.position.x > 110) c.position.x = -110; }
  for (const t of FADE_TREES) {
    const near = Math.hypot(camera.position.x - t.x, camera.position.z - t.z) < 5.5 && camera.position.y > 3;
    t.mat.opacity = lerp(t.mat.opacity, near ? 0.28 : 1, damp(5, dt)); t.mat.depthWrite = t.mat.opacity > 0.95;
  }
  marker.position.set(0, 0.42 + Math.sin(clock * 5) * 0.04, 0.08);
  if (tapRing.userData.t < 0.7) { tapRing.userData.t += dt; const u = tapRing.userData.t / 0.7; tapRing.material.opacity = 0.9 * (1 - u); tapRing.scale.setScalar(1 + u * 1.5); }
  else tapRing.material.opacity = 0;
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  tick(dt);
  requestAnimationFrame(frame);
}
async function iniciar() {
  await carregarModelos();
  buildGround(); buildFlowers();
  ESCONDER = !!MODELOS.praca; buildFountain(); buildTrees(); buildFurniture(); ESCONDER = false;
  if (MODELOS.praca) montarCenario(MODELOS.praca); else buildBlocks();
  P = makeFlyer(makeBird('btv'), 8); M = makeFlyer(makeBird('btv'), 5.5);
  P.m.root.add(marker);
  // Atalhos de desenvolvimento: #etapa2 ou #etapa3 abre direto na etapa; "-dev" expõe o estado em window.btvDev.
  const hash = location.hash.slice(1), etapa = (hash.match(/etapa(\d)/) || [])[1];
  go(etapa === '1' ? card1() : etapa === '2' ? card2() : etapa === '3' ? card3() : titleStage());
  if (hash.includes('dev')) {
    window.btvDev = { G, P, M, NESTM, MODELOS, cam, camera, camLook, makeBird, makeBirdModel, makeToucan, makeHawk, SG, scene3, get stage() { return stage; }, go, card1, card2, card3, card4, finalStage, buscaStage, duetoStage, pontosCasal };
    window.btvDev.tick = (n = 1, dt = 1 / 30) => { for (let i = 0; i < n; i++) tick(dt); };
  }
  last = performance.now();
  requestAnimationFrame(frame);
}
function tick(dt) {
  clock += dt;
  markUsed = 0;
  if (stage && stage.update) stage.update(dt);
  animateWorld(dt);
  updateCamera(dt);
  if (stage && stage.ui) stage.ui();
  for (let i = markUsed; i < markPool.length; i++) markPool[i].hidden = true;
  renderer.render(scene3, camera);
}
iniciar();
})();
</script>
